name: Pull Request

permissions:
  contents: read

on:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: ['windows-latest', 'ubuntu-latest']
        framework: ['net11.0']
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      name: Checkout
    - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 #v6.1.0
      with:
        dotnet-version: |
          11.0
    - run: dotnet test --framework ${{ matrix.framework }}
