name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'vcsjones/xwing-mlkem768-x25519-dotnet'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 #v5.4.0
        with:
          dotnet-version: 11.0

      - name: Package
        run: |
          mkdir -p pkg
          dotnet pack -p:ContinuousIntegrationBuild=true -c Release -o pkg

          for f in pkg/*.nupkg; do
            mv -- "$f" "${f%.nupkg}_unsigned.nupkg"
          done

      - name: Artifact attestation
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 #v4.1.1
        with:
          subject-path: 'pkg/*.nupkg'

      - name: Create GitHub Release
        run: |
          tag_name="$(git describe --tags --abbrev=0)"
          gh release create "${tag_name}" --verify-tag --draft --generate-notes pkg/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
