name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'vcsjones/xwing-mlkem768-x25519-dotnet'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 #v6.0.0
        with:
          dotnet-version: 11.0

      - name: Package
        run: |
          mkdir -p pkg
          dotnet pack -p:ContinuousIntegrationBuild=true -c Release -o pkg

          for f in pkg/*.nupkg; do
            mv -- "$f" "${f%.nupkg}_unsigned.nupkg"
          done

      - name: Artifact attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 #v4.2.0
        with:
          subject-path: 'pkg/*.nupkg'

      - name: Create GitHub Release
        run: |
          tag_name="$(git describe --tags --abbrev=0)"
          gh release create "${tag_name}" --verify-tag --draft --generate-notes pkg/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
